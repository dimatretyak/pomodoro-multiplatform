<!doctype html>
<html lang="ru" data-phase="focus">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0E0B0D" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Pomidoro</title>
    <script>
      // Apply saved theme/phase before first paint so there is no color flash.
      try {
        var d = JSON.parse(localStorage.getItem('pomidoro:v1')) || {}, t = (d.settings && d.settings.theme) || 'system'
        document.documentElement.dataset.theme = t === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : t
        if (d.timer && d.timer.phase) document.documentElement.dataset.phase = d.timer.phase
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
