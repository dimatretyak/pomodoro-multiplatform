<!doctype html>
<html lang="ru" data-phase="focus">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0a09" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Pomidoro</title>
    <script>
      // Apply saved phase before first paint so there is no color flash.
      try {
        var d = JSON.parse(localStorage.getItem('pomidoro:v1')) || {}
        var a = d.settings && d.settings.accent
        if (/^#[0-9a-f]{6}$/i.test(a)) document.documentElement.style.setProperty('--focus', a)
        if (d.timer && d.timer.phase) document.documentElement.dataset.phase = d.timer.phase
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
